<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haze Monitor · Singapore &amp; ASEAN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F4F6F7;--card:#fff;--ink:#1F2A30;--mute:#6B7A82;--line:#E3E8EA;--accent:#C9731A;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181B;--card:#1A2226;--ink:#E8EEF0;--mute:#8C9CA4;--line:#2A353A;--accent:#E8963A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181B;--card:#1A2226;--ink:#E8EEF0;--mute:#8C9CA4;--line:#2A353A;--accent:#E8963A;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:40px 24px 64px}
header{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:28px}
h1{font-size:2rem;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}.sub{color:var(--mute);margin:0;font-size:.95rem}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-size:.9rem;font-weight:500;padding:8px 18px;border-radius:999px;cursor:pointer}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
button:focus-visible,.reg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none}
/* haze section: fixed dark */
.haze{--h-bg:#1b1e20;--h-in:#141617;--h-line:#2e3336;--h-ink:#ece8df;--h-mute:#9a9fa2;background:var(--h-bg);color:var(--h-ink);border:1px solid var(--h-line);border-radius:16px;padding:32px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;font-size:.75rem;color:var(--h-mute)}
.haze h2{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:2.2rem;margin:8px 0 0;letter-spacing:-.01em}
.hh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
.chips{display:flex;gap:10px;flex-wrap:wrap}.chip{border:1px solid var(--h-line);border-radius:999px;padding:6px 14px;font-size:.85rem}
.bento{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;grid-template-areas:"map sel" "map stats" "areas help"}
.blk{background:var(--h-in);border:1px solid var(--h-line);border-radius:12px;padding:20px 22px;min-width:0}
.blk .mono{margin-bottom:12px}
#bMap{grid-area:map;display:flex;flex-direction:column}#bSel{grid-area:sel}#bStats{grid-area:stats;display:grid;grid-template-columns:1fr 1fr;gap:12px;background:none;border:0;padding:0}
#bAreas{grid-area:areas}#bHelp{grid-area:help}
#bMap svg{margin:auto 0}
.stat{background:var(--h-in);border:1px solid var(--h-line);border-radius:12px;padding:16px 18px}
.stat .mono{font-size:.68rem;margin-bottom:8px}.stat b{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:1.1rem}
.big{font-family:Newsreader,Georgia,serif;font-size:6.5rem;line-height:.9;letter-spacing:-.03em}
.lvl{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:500}.lvl i{width:12px;height:12px;border-radius:50%}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:center;margin-top:18px}
.scale i{height:7px;border-radius:7px;display:block}.scale i.on{height:15px}
.ticks{display:grid;grid-template-columns:repeat(5,1fr);margin-top:10px;font-family:"JetBrains Mono",monospace;font-size:.75rem;color:var(--h-mute);text-align:right}
.arow{display:grid;grid-template-columns:70px 1fr 36px;gap:12px;align-items:center;padding:9px 10px;border-radius:8px;border:1px solid transparent;width:100%;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.arow.on{border-color:var(--h-line);background:#1b1e20}
.abar{height:6px;border-radius:6px;background:#262b2e;overflow:hidden}.abar i{display:block;height:100%;border-radius:6px}
.arow .n{text-align:right;font-family:Newsreader,serif;font-size:1.3rem}
.desc{font-size:1.02rem;line-height:1.55;margin:0 0 16px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-right:10px;vertical-align:-1px}
.foot{color:var(--h-mute);margin:16px 0 0;font-size:.88rem}
.reg{cursor:pointer}.reg:hover{filter:brightness(1.2)}
svg text{font-family:Figtree,system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin-top:20px}
.city .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:14px}
.city h3{margin:0;font-size:1.05rem;font-weight:600}.city small,.lbl{color:var(--mute);font-size:.82rem}
.t{font-size:2.6rem;font-weight:600;letter-spacing:-.03em;line-height:1}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;font-size:.78rem;color:var(--mute)}
.mini b{display:block;color:var(--ink);font-size:.95rem}
.pill{padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--bg);color:var(--mute);white-space:nowrap;height:fit-content}
.src{margin-top:28px;font-size:.82rem;color:var(--mute)}
h3.sec{margin:32px 0 0;font-size:1.05rem}
@media(max-width:860px){.bento{grid-template-columns:1fr;grid-template-areas:"map" "sel" "stats" "areas" "help"}.haze{padding:18px 12px}.big{font-size:5rem}.wrap{padding:28px 14px 48px}h1{font-size:1.6rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Haze monitor</h1><p class="sub">Singapore haze from NEA. Weather from Open-Meteo.</p></div>
  <div class="seg" role="tablist"><button role="tab" id="tab-sg" aria-selected="true">Singapore</button><button role="tab" id="tab-asean" aria-selected="false">ASEAN</button></div>
</header>

<section id="v-sg">
 <div class="haze">
  <div class="hh">
   <div><div class="mono">Singapore · NEA 24-hour PSI</div><h2>PSI by area</h2></div>
   <div class="chips"><span class="chip" id="chipNat"></span><span class="chip" id="chipTime"></span></div>
  </div>
  <div class="bento">
   <div class="blk" id="bMap"><div class="mono">Map</div><svg id="map" viewBox="0 0 640 440" width="100%" role="img" aria-label="Map of Singapore with PSI for five areas"></svg></div>
   <div class="blk" id="bSel"></div>
   <div id="bStats"></div>
   <div class="blk" id="bAreas"><div class="mono">All areas, highest first</div><div id="areaRows"></div></div>
   <div class="blk" id="bHelp"><div class="mono">What it means</div><p class="desc" id="advice"></p><div class="legend" id="legend"></div></div>
  </div>
  <p class="foot" id="foot">Loading NEA readings…</p>
 </div>
 <h3 class="sec">Weather in Singapore</h3>
 <div class="cities" id="sgwx"></div>
</section>

<section id="v-asean" class="hide">
 <div class="seg" id="sort" style="margin-top:4px"><button data-k="name" aria-pressed="true">Name</button><button data-k="temp" aria-pressed="false">Warmest</button><button data-k="rain" aria-pressed="false">Rain chance</button></div>
 <div class="cities" id="cities"></div>
 <p class="src">Haze readings from NEA cover Singapore only, so other cities show weather only.</p>
</section>
<p class="src" id="wxnote"></p>
</div>

<script>
const BANDS=[
 {max:50,name:"Good",c:"#5fb98a",d:"Air quality is good. Enjoy outdoor activities as usual."},
 {max:100,name:"Moderate",c:"#e6c544",d:"Air is acceptable. Normal activity is fine; unusually sensitive people may notice mild irritation."},
 {max:200,name:"Unhealthy",c:"#e8705a",d:"Everyone may begin to feel effects. Reduce prolonged or strenuous outdoor activity."},
 {max:300,name:"Very unhealthy",c:"#a574d6",d:"Avoid outdoor exertion. Wear an N95 mask if you must go out."},
 {max:9999,name:"Hazardous",c:"#d9587a",d:"Stay indoors with windows closed and minimise physical activity."}
];
const band=p=>p==null?null:BANDS.find(b=>p<=b.max);
const REG={
 north:{n:"North",e:"Woodlands, Sembawang, Yishun",box:[373,80]},
 west:{n:"West",e:"Jurong, Tuas, Clementi",box:[124,236]},
 central:{n:"Central",e:"Toa Payoh, Bishan, Orchard",box:[365,227]},
 east:{n:"East",e:"Tampines, Changi, Bedok",box:[607,236]},
 south:{n:"South",e:"Marina Bay, Sentosa, Queenstown",box:[373,476]}
};
// Reading from the supplied screenshot (10:00 SGT, 28 Oct 2026), used only when the live feed is unreachable
const FALLBACK={reg:{north:{psi:78},west:{psi:78},central:{psi:78,pm25:36,pm10:50,main:"PM2.5"},east:{psi:74},south:{psi:67}},ts:"10:00",upd:"10:15",live:false};
let H=null,sel="central";
const J=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};
async function loadHaze(){
  try{
    const j=await J("https://api-open.data.gov.sg/v2/real-time/api/psi"),it=j.data.items[0],d=it.readings,out={reg:{},live:true};
    let p1={};try{p1=(await J("https://api-open.data.gov.sg/v2/real-time/api/pm25")).data.items[0].readings.pm25_one_hourly||{}}catch(e){}
    for(const k in REG){
      const subs={"PM2.5":d.pm25_sub_index?.[k],"PM10":d.pm10_sub_index?.[k],"O₃":d.o3_sub_index?.[k],"SO₂":d.so2_sub_index?.[k],"CO":d.co_sub_index?.[k]};
      const top=Object.entries(subs).filter(e=>e[1]!=null).sort((a,b)=>b[1]-a[1])[0];
      out.reg[k]={psi:d.psi_twenty_four_hourly?.[k],pm25:d.pm25_twenty_four_hourly?.[k],pm10:d.pm10_twenty_four_hourly?.[k],pm1h:p1[k],main:top?top[0]:null};
    }
    out.nat=d.psi_twenty_four_hourly?.national;out.ts=(it.timestamp||"").slice(11,16);out.upd=(it.updatedTimestamp||"").slice(11,16);H=out;
  }catch(e){H=FALLBACK}
  renderHaze();
}
// Singapore outline (lon,lat), projected to the map
const X=lo=>(lo-103.6)*1400+8,Y=la=>(1.48-la)*1400+22;
const pts=a=>a.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
const MAIN=[[103.605,1.304],[103.625,1.335],[103.655,1.365],[103.685,1.395],[103.700,1.425],[103.735,1.440],[103.760,1.445],[103.780,1.462],[103.820,1.472],[103.850,1.450],[103.870,1.425],[103.895,1.418],[103.915,1.405],[103.945,1.395],[103.970,1.385],[103.995,1.385],[104.030,1.350],[104.040,1.322],[104.000,1.310],[103.965,1.305],[103.930,1.290],[103.905,1.285],[103.880,1.282],[103.865,1.270],[103.845,1.268],[103.820,1.270],[103.790,1.268],[103.760,1.272],[103.730,1.277],[103.700,1.285],[103.680,1.268],[103.650,1.255],[103.630,1.270],[103.612,1.285]];
const JUR=[[103.670,1.285],[103.710,1.290],[103.725,1.270],[103.700,1.255],[103.670,1.265]];
const SEN=[[103.810,1.248],[103.830,1.242],[103.850,1.244],[103.857,1.250],[103.835,1.254],[103.815,1.255]];
const UBN=[[103.950,1.405],[103.985,1.410],[103.990,1.420],[103.960,1.425]];
const TEK=[[104.010,1.395],[104.050,1.400],[104.050,1.420],[104.015,1.418]];
const CTR={north:[103.82,1.415],west:[103.69,1.345],central:[103.835,1.350],east:[103.96,1.345]};
function renderHaze(){
  const x1=X(103.765),x2=X(103.90),y1=Y(1.385),y2=Y(1.315),T=(k,n)=>H.reg[k][n];
  const R=(k,x,y,w,h)=>{const p=T(k,"psi"),b=band(p);return `<rect class="reg" data-k="${k}" x="${x}" y="${y}" width="${w}" height="${h}" fill="${b?b.c:"#777"}" fill-opacity=".36" tabindex="0" role="button" aria-label="${REG[k].n} PSI ${p??"unavailable"}"/>`};
  const tint=k=>{const b=band(T(k,"psi"));return b?b.c:"#777"};
  let s=`<defs><clipPath id="isl"><polygon points="${pts(MAIN)}"/></clipPath></defs>`;
  s+=`<text x="${X(103.82)}" y="12" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" letter-spacing="2" fill="#9a9fa2">JOHOR, MALAYSIA</text>`;
  s+=`<g clip-path="url(#isl)">${R("west",0,0,x1,440)+R("east",x2,0,640-x2,440)+R("north",x1,0,x2-x1,y1)+R("central",x1,y1,x2-x1,y2-y1)+R("south",x1,y2,x2-x1,440-y2)}<path d="M${x1} 0V440M${x2} 0V440M${x1} ${y1}H${x2}M${x1} ${y2}H${x2}" stroke="#141617" stroke-width="2" fill="none"/></g>`;
  s+=`<polygon points="${pts(JUR)}" fill="${tint("west")}" fill-opacity=".36"/><polygon points="${pts(SEN)}" fill="${tint("south")}" fill-opacity=".36"/><polygon points="${pts(UBN)}" fill="${tint("east")}" fill-opacity=".36"/><polygon points="${pts(TEK)}" fill="${tint("east")}" fill-opacity=".36"/>`;
  const sx=X(103.835),sy=392;
  s+=`<path d="M${sx} 330V${sy}" stroke="#9a9fa2" stroke-dasharray="2 5"/><circle cx="${sx}" cy="${y2+34}" r="3.5" fill="#9a9fa2"/>`;
  s+=`<text x="8" y="434" font-family="JetBrains Mono,monospace" font-size="9" letter-spacing="2" fill="#9a9fa2">SINGAPORE STRAIT</text>`;
  const boxes={};for(const k in CTR)boxes[k]=[X(CTR[k][0]),Y(CTR[k][1])];boxes.south=[sx,sy+31];
  for(const k in REG){
    const [cx,cy]=boxes[k],x=cx-50,y=cy-31,p=T(k,"psi"),b=band(p),col=b?b.c:"#777";
    if(k===sel)s+=`<rect x="${x-5}" y="${y-5}" width="110" height="72" rx="8" fill="none" stroke="#e8e6e0" stroke-width="1.6"/>`;
    s+=`<g pointer-events="none"><rect x="${x}" y="${y}" width="100" height="62" rx="5" fill="#181b1d" stroke="${col}" stroke-width="1.4"/>
    <text x="${cx}" y="${y+15}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8.5" letter-spacing="1.5" fill="#9a9fa2">${REG[k].n.toUpperCase()}</text>
    <text x="${cx}" y="${y+43}" text-anchor="middle" font-family="Newsreader,Georgia,serif" font-size="30" fill="#ece8df">${p??"—"}</text>
    <text x="${cx}" y="${y+57}" text-anchor="middle" font-size="10" fill="#ece8df">${b?b.name:"No data"}</text></g>`;
  }
  const m=document.getElementById("map");m.innerHTML=s;
  const go=k=>{sel=k;renderHaze()};
  m.querySelectorAll(".reg").forEach(e=>{e.onclick=()=>go(e.dataset.k);e.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();go(e.dataset.k)}}});
  const d=H.reg[sel],p=d.psi,b=band(p),i=b?BANDS.indexOf(b):-1,fmt=v=>v==null?"—":v+" µg/m³";
  document.getElementById("bSel").innerHTML=`<div class="mono">${REG[sel].n} · e.g. ${REG[sel].e}</div>
   <div style="display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap"><div class="big">${p??"—"}</div><div class="lvl" style="padding-bottom:10px"><i style="background:${b?b.c:"#777"}"></i>${b?b.name:"No data"}</div></div>
   <div class="scale">${BANDS.map((x,n)=>`<i class="${n===i?"on":""}" style="background:${x.c};opacity:${n===i?1:.3}"></i>`).join("")}</div>
   <div class="ticks"><span>50</span><span>100</span><span>200</span><span>300</span><span>300+</span></div>`;
  document.getElementById("bStats").innerHTML=[["PM2.5, 24 h",fmt(d.pm25)],["PM2.5, 1 h",fmt(d.pm1h)],["PM10, 24 h",fmt(d.pm10)],["Main pollutant",d.main??"—"]].map(r=>`<div class="stat"><div class="mono">${r[0]}</div><b>${r[1]}</b></div>`).join("");
  document.getElementById("areaRows").innerHTML=Object.keys(REG).sort((a,c)=>(H.reg[c].psi??-1)-(H.reg[a].psi??-1)).map(k=>{const v=H.reg[k].psi,bb=band(v);return `<button class="arow ${k===sel?"on":""}" data-k="${k}"><span>${REG[k].n}</span><span class="abar"><i style="width:${Math.min(100,(v||0)/3)}%;background:${bb?bb.c:"#777"}"></i></span><span class="n">${v??"—"}</span></button>`}).join("");
  document.querySelectorAll(".arow").forEach(e=>e.onclick=()=>go(e.dataset.k));
  document.getElementById("advice").textContent=b?b.d:"The NEA reading for this area isn’t available right now.";
  document.getElementById("chipNat").textContent="National PSI "+(H.nat??"—");
  document.getElementById("chipTime").textContent=H.live?`${H.ts} SGT · updated ${H.upd}`:`${H.ts} SGT · sample`;
  document.getElementById("foot").textContent=H.live
   ?"Source: NEA via data.gov.sg. Area boundaries are approximate. PSI is a 24-hour measure and NEA updates it every hour. Tap an area for details."
   :`Live NEA feed (data.gov.sg) can’t be reached from this preview, so this shows the ${H.ts} SGT reading from your screenshot. Open the file outside the preview to load live data. Area boundaries are approximate.`;
}
document.getElementById("legend").innerHTML=BANDS.map((b,i)=>`<span style="--c:${b.c}">${b.name} ${[0,51,101,201,301][i]}${i<4?"–"+b.max:"+"}</span>`).join("");

// ---- weather (Open-Meteo) ----
const CITY=[
 ["Singapore","Singapore",1.3521,103.8198],["Kuala Lumpur","Malaysia",3.139,101.6869],["Jakarta","Indonesia",-6.2088,106.8456],
 ["Bangkok","Thailand",13.7563,100.5018],["Manila","Philippines",14.5995,120.9842],["Hanoi","Vietnam",21.0285,105.8542],
 ["Ho Chi Minh City","Vietnam",10.8231,106.6297],["Bandar Seri Begawan","Brunei",4.9031,114.9398]
];
const sky=c=>c===0?"Clear":c<=2?"Partly cloudy":c===3?"Overcast":c<=48?"Fog":c<=57?"Drizzle":c<=67?"Rain":c<=77?"Snow":c<=82?"Showers":"Thunderstorm";
let WX=null,sortKey="name";
async function loadWx(){
  try{
    const u="https://api.open-meteo.com/v1/forecast?latitude="+CITY.map(c=>c[2]).join(",")+"&longitude="+CITY.map(c=>c[3]).join(",")+"&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=precipitation_probability_max&forecast_days=1&timezone=auto";
    const r=await fetch(u);if(!r.ok)throw new Error(r.status);
    const j=await r.json();WX=CITY.map((c,i)=>{const o=j[i]||j;return{t:Math.round(o.current.temperature_2m),h:o.current.relative_humidity_2m,w:Math.round(o.current.wind_speed_10m),s:sky(o.current.weather_code),r:o.daily.precipitation_probability_max[0]}});
    document.getElementById("wxnote").textContent="Weather: Open-Meteo, current conditions.";
  }catch(e){WX=null;document.getElementById("wxnote").textContent="Open-Meteo can’t be reached from this preview, so weather values show as — until the file is opened outside it."}
  renderWx();
}
function card(i){
  const c=CITY[i],w=WX&&WX[i],v=(x,u="")=>x==null?"—":x+u;
  const psi=i===0&&H&&H.reg?(()=>{const a=Object.values(H.reg).map(r=>r.psi).filter(x=>x!=null);return a.length?Math.max(...a):null})():null;
  return `<article class="card city"><div class="top"><div><h3>${c[0]}</h3><small>${c[1]}</small></div>${i===0&&psi!=null?`<span class="pill">PSI up to ${psi}</span>`:""}</div>
  <div class="t">${w?w.t+"°":"—"}</div><p class="lbl" style="margin:8px 0 0">${w?w.s:"Weather unavailable"}</p>
  <div class="mini"><div><b>${v(w&&w.h,"%")}</b>Humidity</div><div><b>${v(w&&w.w," km/h")}</b>Wind</div><div><b>${v(w&&w.r,"%")}</b>Rain chance</div></div></article>`;
}
function renderWx(){
  document.getElementById("sgwx").innerHTML=card(0);
  const idx=CITY.map((_,i)=>i);
  idx.sort((a,b)=>sortKey==="name"?CITY[a][0].localeCompare(CITY[b][0]):sortKey==="temp"?((WX?.[b].t??0)-(WX?.[a].t??0)):((WX?.[b].r??0)-(WX?.[a].r??0)));
  document.getElementById("cities").innerHTML=idx.map(card).join("");
}
document.querySelectorAll("#sort button").forEach(b=>b.onclick=()=>{sortKey=b.dataset.k;document.querySelectorAll("#sort button").forEach(x=>x.setAttribute("aria-pressed",x===b));renderWx()});
function tab(v){["sg","asean"].forEach(k=>{document.getElementById("v-"+k).classList.toggle("hide",k!==v);document.getElementById("tab-"+k).setAttribute("aria-selected",k===v)})}
document.getElementById("tab-sg").onclick=()=>tab("sg");document.getElementById("tab-asean").onclick=()=>tab("asean");
H=FALLBACK;renderHaze();renderWx();loadHaze();loadWx();
</script>
</body>
</html>
